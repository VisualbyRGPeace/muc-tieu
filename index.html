<style>
:root{--bg:#000000;--card:#0a0a0a;--card2:#141414;--line:#2a2a2a;--b:#ffffff;--b2:#d4d4d4;--tx:#ffffff;--mut:#8a8a8a;--ok:#ffffff;--bad:#ffffff;--warn:#a3a3a3}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;min-height:100%}
body{padding:env(safe-area-inset-top) 0 0}
#app{max-width:760px;margin:0 auto;padding:16px 14px calc(96px + env(safe-area-inset-bottom))}
h1{font-size:22px;margin:0}.sub{color:var(--mut);font-size:13px}
.top{display:flex;justify-content:space-between;align-items:center;margin:6px 0 16px}
.ico{background:var(--card2);border:1px solid var(--line);color:var(--tx);border-radius:12px;padding:8px 12px;font-size:13px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center}
.stat b{display:block;font-size:24px}.stat span{font-size:12px;color:var(--mut)}
.tabs{display:flex;background:var(--card);border-radius:14px;padding:4px;margin-bottom:14px;border:1px solid var(--line)}
.tabs button{flex:1;border:0;background:none;color:var(--mut);padding:10px;border-radius:10px;font-weight:600;font-size:15px}
.tabs button.on{background:var(--b);color:#fff}
.goal{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;margin-bottom:12px}
.goal.done{opacity:.8}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.t{font-weight:700;font-size:17px}.done .t{text-decoration:line-through;color:var(--mut)}
.chip{font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;white-space:nowrap}
.c-ok{background:#ffffff22;color:var(--ok)}.c-bad{background:#ffffff22;color:var(--bad)}.c-b{background:#ffffff22;color:var(--b2)}.c-w{background:#a3a3a322;color:var(--warn)}
.note{color:var(--mut);font-size:14px;margin:6px 0 0;white-space:pre-wrap}
.sq{display:grid;grid-template-columns:repeat(20,1fr);gap:4px;margin:12px 0 4px}
.sq i{aspect-ratio:1;border-radius:4px;background:#1a1a1a}.sq i.f{background:var(--b);box-shadow:0 0 8px #ffffff55}
.done .sq i.f{background:var(--ok);box-shadow:none}
.pct{font-size:12px;color:var(--mut);display:flex;justify-content:space-between}
.btns{display:flex;gap:8px;margin-top:10px}
.btn{border:0;border-radius:14px;padding:12px;font-weight:700;font-size:15px;color:#fff;background:var(--b);flex:1}
.btn.g{background:var(--card2);color:var(--b2);border:1px solid var(--line)}.btn.r{background:#ffffff22;color:var(--bad)}
.fab{position:fixed;right:max(18px,calc(50% - 360px));bottom:calc(22px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:50%;border:0;background:var(--b);color:#fff;font-size:34px;box-shadow:0 8px 24px #ffffff66}
.empty{text-align:center;color:var(--mut);padding:40px 0}
.modal{position:fixed;inset:0;background:#000b;display:none;align-items:flex-end;justify-content:center;z-index:9}
.modal.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
@media(min-width:700px){.modal{align-items:center}.sheet{border-radius:24px}}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px}
input,select,textarea{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--tx);border-radius:12px;padding:12px;font:inherit;font-size:16px}
input[type=range]{padding:0;accent-color:var(--b)}
textarea{min-height:90px;resize:vertical}
.auth{max-width:380px;margin:12vh auto 0;text-align:center}
.auth input{margin-bottom:10px}.err{color:var(--bad);font-size:13px;min-height:18px}
/* ===== Giao diện nâng cao ===== */
:root{color-scheme:dark;--glow:#ffffff40;--r:20px}
body{background:radial-gradient(900px 500px at 85% -10%,#ffffff14,transparent 60%),radial-gradient(700px 400px at -10% 30%,#ffffff0d,transparent 60%),var(--bg);background-attachment:fixed}
#app{max-width:900px}
h1{background:linear-gradient(90deg,#fff,var(--b2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:-.4px}
.top{padding:4px 2px}
.ico{transition:.2s}.ico:hover{border-color:var(--b);color:var(--b2)}
.stat{position:relative;overflow:hidden;background:linear-gradient(160deg,#121212,#050505);transition:transform .2s}
.stat::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--b)}
.stat:nth-child(1)::before{background:var(--ok)}.stat:nth-child(3)::before{background:var(--bad)}
.stat:hover{transform:translateY(-2px)}
.stat b{font-size:28px;letter-spacing:-1px}
.tabs{position:sticky;top:calc(env(safe-area-inset-top) + 6px);z-index:5;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);background:#0a0a0acc;box-shadow:0 6px 24px #0008}
.tabs button{transition:.25s;cursor:pointer}
.tabs button.on{background:linear-gradient(135deg,var(--b),#cfcfcf);box-shadow:0 4px 14px var(--glow)}
.tabs button:not(.on):hover{color:var(--tx)}
#app>.goal,#app>div.goal{animation:up .4s both}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media(min-width:900px){#app{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
 .top,.stats,.tabs,.empty{grid-column:1/-1}.goal{margin:0}}

.goal::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--b)}
.goal:has(.c-bad)::before{background:var(--bad)}.goal:has(.c-ok)::before{background:var(--ok)}.goal:has(.c-w)::before{background:var(--warn)}
.goal:hover{transform:translateY(-2px);border-color:#ffffff66}
.t{letter-spacing:-.2px}
.chip{border:1px solid currentColor;border-color:#ffffff14}
.sq i{transition:background .3s}
.sq i.f{background:linear-gradient(135deg,var(--b2),var(--b))}
.done .sq i.f{background:linear-gradient(135deg,#ffffff,var(--ok))}
.btn{cursor:pointer;transition:transform .12s,filter .2s;background:linear-gradient(135deg,var(--b),#cfcfcf);box-shadow:0 4px 14px var(--glow)}
.btn:hover{filter:brightness(1.12)}.btn:active{transform:scale(.96)}
.btn.g,.btn.r{box-shadow:none;background:var(--card2)}.btn.r{background:#ffffff1f}
.btn.g:hover{border-color:var(--b)}
.fab{cursor:pointer;background:linear-gradient(135deg,var(--b2),var(--b));transition:transform .2s;z-index:6}
.fab:hover{transform:rotate(90deg) scale(1.08)}.fab:active{transform:scale(.92)}
.modal{backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:fade .2s}
.sheet{border:1px solid var(--line);background:linear-gradient(180deg,#121212,#050505);animation:slide .3s cubic-bezier(.2,.8,.2,1)}
@keyframes fade{from{opacity:0}}@keyframes slide{from{transform:translateY(40px);opacity:0}}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--b);box-shadow:0 0 0 3px var(--glow)}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:48px 16px}
.auth{background:linear-gradient(160deg,#121212,#050505);border:1px solid var(--line);border-radius:28px;padding:32px 22px;box-shadow:0 20px 60px #000a}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
button,select{font-family:inherit}

.btn{color:#000}.btn.g,.btn.r{color:#fff}

.chip{border:1px solid #ffffff22}

body{color-scheme:dark}
/* ===== Giao diện v2: icon line + bottom nav ===== */
#app{padding-bottom:calc(150px + env(safe-area-inset-bottom))}

.fab{display:grid;place-items:center;font-size:0;bottom:calc(88px + env(safe-area-inset-bottom));right:max(16px,calc(50% - 440px));width:58px;height:58px}

.goal .row{align-items:center;gap:12px}.gm{flex:1;min-width:0}
.gi{width:44px;height:44px;border-radius:14px;background:#1a1a1a;border:1px solid var(--line);display:grid;place-items:center;flex:none}
.t{font-size:16px}.goal .sub{margin-top:2px}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.sm{flex:none;padding:9px 14px;font-size:14px;border-radius:12px}
.seg{display:flex;gap:4px;background:var(--card2);padding:4px;border-radius:14px;border:1px solid var(--line)}
.seg button{flex:1;display:flex;gap:6px;align-items:center;justify-content:center;padding:10px;border:0;border-radius:10px;background:none;color:var(--mut);font-weight:600;font-size:15px;cursor:pointer}
.seg button.on{background:#fff;color:#000}
.empty{grid-column:1/-1}.empty svg{opacity:.45;margin-bottom:8px}
.auth h1{display:flex;align-items:center;justify-content:center;gap:10px}
@media(max-width:380px){.hero{flex-direction:column;text-align:center}.mini{justify-content:center}}

body{letter-spacing:-.005em;-webkit-font-smoothing:antialiased}

.today{color:var(--mut);margin-top:14px;font-size:15px}.today b{color:#fff;font-weight:700}

.chips button,.nav button,.btn{letter-spacing:0}

<script type="module">
if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));

/* ===== 1) DÁN CẤU HÌNH FIREBASE CỦA BẠN VÀO ĐÂY ===== */
const firebaseConfig = {
  apiKey: "AIzaSyAd3NrPF3yMCjEcr-ibgzMzTXl8yIFe69U",
  authDomain: "muc-tieu-e4fca.firebaseapp.com",

  messagingSenderId: "594534428988",
  appId: "1:594534428988:web:0001a1fe43d2cfed6e6e39"
};
/* ================================================== */

const LOCAL = firebaseConfig.apiKey.startsWith("YOUR");
const V = "10.12.2", G = `https://www.gstatic.com/firebasejs/${V}/`;
let fb = {}, uid = null, goals = [], tab = "week", unsub = null;

if (!LOCAL) {
  const [A, Au, Fs] = await Promise.all([import(G+"firebase-app.js"), import(G+"firebase-auth.js"), import(G+"firebase-firestore.js")]);
  const app = A.initializeApp(firebaseConfig);
  fb = { auth: Au.getAuth(app), db: Fs.getFirestore(app), ...Au, ...Fs };
}

/* ---------- ngày tháng ---------- */
const iso = d => { const z = new Date(d); z.setMinutes(z.getMinutes() - z.getTimezoneOffset()); return z.toISOString().slice(0, 10); };
const today = () => iso(new Date());
const diff = (a, b) => Math.round((new Date(a) - new Date(b)) / 864e5); // a - b (ngày)
const fmt = s => s.split("-").reverse().slice(0, 2).join("/");
function endOf(level) {
  const d = new Date();
  if (level === "week") d.setDate(d.getDate() + ((7 - d.getDay()) % 7));
  else if (level === "month") { d.setMonth(d.getMonth() + 1, 0); }
  else { d.setMonth(11, 31); }
  return iso(d);
}
const LV = { week: "Tuần", month: "Tháng", year: "Năm" };

/* ---------- lưu trữ / đồng bộ ---------- */
async function save() {
  if (LOCAL) localStorage.setItem("goals", JSON.stringify(goals));
  else await fb.setDoc(fb.doc(fb.db, "users", uid), { goals });
  render();
}
function start() {
  if (LOCAL) { goals = JSON.parse(localStorage.getItem("goals") || "[]"); return render(); }
  unsub = fb.onSnapshot(fb.doc(fb.db, "users", uid), s => { goals = s.exists() ? s.data().goals || [] : []; render(); });
}
if (LOCAL) setTimeout(start);
else fb.onAuthStateChanged(fb.auth, u => {
  if (unsub) unsub();
  uid = u ? u.uid : null;
  u ? start() : authView();
});

/* ---------- trạng thái từng mục tiêu ---------- */
function status(g) {
  const t = today();
  if (g.done) {
    const d = diff(g.due, g.doneAt);
    if (d > 0) return ["Xong sớm " + d + " ngày", "c-ok"];
    if (d < 0) return ["Xong trễ " + -d + " ngày", "c-w"];
    return ["Xong đúng hạn", "c-ok"];
  }
  const d = diff(g.due, t);
  if (d < 0) return ["Trễ " + -d + " ngày", "c-bad"];
  if (d === 0) return ["Hạn hôm nay", "c-w"];
  return ["Còn " + d + " ngày", "c-b"];
}

/* ---------- icon (line, kiểu Lucide) ---------- */
var P = {
target:'<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>',
plus:'<path d="M5 12h14M12 5v14"/>',check:'<path d="M20 6 9 17l-5-5"/>',
undo:'<path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-15-6.7L3 13"/>',
edit:'<path d="M12 20h9"/><path d="M16.4 3.6a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>',
trash:'<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/>',
out:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5M21 12H9"/>',
cal:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
alert:'<circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/>',
clock:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
trophy:'<path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6M18 9h1.5a2.5 2.5 0 0 0 0-5H18M4 22h16M10 14.7V17c0 .6-.5 1-1.1 1.2C7.8 18.8 7 20.2 7 22M14 14.7V17c0 .6.5 1 1.1 1.2 1.1.6 1.9 2 1.9 3.8M18 2H6v7a6 6 0 0 0 12 0Z"/>',
week:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18M8 14h.01M12 14h.01M16 14h.01"/>',
month:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18M8 14h8M8 18h5"/>',
year:'<path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>',
list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
x:'<path d="M18 6 6 18M6 6l12 12"/>',cloud:'<path d="M17.5 19H9a7 7 0 1 1 6.7-9h1.8a4.5 4.5 0 0 1 0 9Z"/>'
};
var LI = { week: "week", month: "month", year: "year" }, flt = "all";
const ic = (n, s = 18) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${P[n]}</svg>`;
const esc = s => (s || "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/* ---------- giao diện ---------- */
function render() {
  const t = today(), now = new Date();
  const inTab = goals.filter(g => g.level === tab);
  const dn = inTab.filter(g => g.done).length, lt = inTab.filter(g => !g.done && g.due < t).length, dg = inTab.length - dn - lt;
  const pct = inTab.length ? Math.round(inTab.reduce((a, g) => a + (g.done ? 100 : g.progress), 0) / inTab.length) : 0;
  const F = { all: () => 1, doing: g => !g.done && g.due >= t, late: g => !g.done && g.due < t, done: g => g.done };
  const N = { all: inTab.length, doing: dg, late: lt, done: dn };
  const FL = { all: "Tất cả", doing: "Đang làm", late: "Trễ hạn", done: "Đã xong" };
  const TT = { week: "Tuần này", month: "Tháng này", year: "Năm nay" };
  const list = inTab.filter(F[flt]).sort((a, b) => (a.done - b.done) || a.due.localeCompare(b.due));
  const wd = ["Chủ Nhật", "Thứ Hai", "Thứ Ba", "Thứ Tư", "Thứ Năm", "Thứ Sáu", "Thứ Bảy"][now.getDay()];
  const C = 2 * Math.PI * 34;
  document.getElementById("app").innerHTML = `
  <div class="top"><div><h1>Tháng ${now.getMonth() + 1}</h1><button class="lnk" data-t="year">Xem cả năm ▾</button><div class="today">Hôm nay: <b>${wd}, ${now.getDate()}/${now.getMonth() + 1}/${now.getFullYear()}</b></div></div>
  <div style="display:flex;gap:8px;align-items:center">${LOCAL ? '<span class="sub">Local</span>' : `<span class="sub">${ic("cloud", 14)} Đã đồng bộ</span><button class="ib" id="out" title="Đăng xuất">${ic("out", 17)}</button>`}</div></div>
  <div class="hero">
    <svg class="ring" viewBox="0 0 80 80"><circle cx="40" cy="40" r="34" fill="none" stroke="#222" stroke-width="7"/>
    <circle cx="40" cy="40" r="34" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - pct / 100)}" transform="rotate(-90 40 40)"/>
    <text x="40" y="46" text-anchor="middle" fill="#fff" font-size="19" font-weight="700">${pct}%</text></svg>
    <div><h2>${TT[tab]}</h2><div class="sub">${dn}/${inTab.length} mục tiêu hoàn thành</div>
    <div class="mini"><span>${ic("trophy", 15)}<b>${dn}</b> xong</span><span>${ic("clock", 15)}<b>${dg}</b> đang làm</span><span>${ic("alert", 15)}<b>${lt}</b> trễ</span></div></div>
  </div>
  <div class="chips">${Object.keys(FL).map(k => `<button data-f="${k}" class="${k === flt ? "on" : ""}">${FL[k]} <em>${N[k]}</em></button>`).join("")}</div>
  ${list.length ? list.map(card).join("") : `<div class="empty">${ic("target", 44)}<br>${inTab.length ? "Không có mục tiêu ở bộ lọc này." : "Chưa có mục tiêu " + LV[tab].toLowerCase() + ".<br>Bấm nút + để thêm."}</div>`}
  <button class="fab" id="add" title="Thêm mục tiêu">${ic("plus", 28)}</button>
  <nav class="nav">${Object.keys(LV).map(k => `<button data-t="${k}" class="${k === tab ? "on" : ""}">${ic(LI[k], 22)}<span>${LV[k]}</span></button>`).join("")}</nav>`;
  document.querySelectorAll("[data-t]").forEach(b => b.onclick = () => { tab = b.dataset.t; flt = "all"; render(); scrollTo(0, 0); });
  document.querySelectorAll("[data-f]").forEach(b => b.onclick = () => { flt = b.dataset.f; render(); });
  document.getElementById("add").onclick = () => edit();
  const o = document.getElementById("out"); if (o) o.onclick = () => fb.signOut(fb.auth);
  document.querySelectorAll("[data-done]").forEach(b => b.onclick = () => toggle(b.dataset.done));
  document.querySelectorAll("[data-edit]").forEach(b => b.onclick = () => edit(b.dataset.edit));
}
function card(g) {
  const [txt, cls] = status(g), f = Math.round(g.progress / 5);
  const si = cls === "c-bad" ? "alert" : cls === "c-ok" ? "trophy" : "clock";
  return `<div class="goal ${g.done ? "done" : ""}">
    <div class="row"><div class="gi">${ic(LI[g.level], 20)}</div>
      <div class="gm"><div class="t">${esc(g.title)}</div><div class="sub">${ic("cal", 13)} Hạn ${fmt(g.due)}${g.done ? " · Xong " + fmt(g.doneAt) : ""}</div></div>
      <button class="ib" data-edit="${g.id}" title="Sửa / ghi chú">${ic("edit", 16)}</button></div>
    ${g.note ? `<div class="note">${esc(g.note)}</div>` : ""}
    <div class="sq">${Array.from({ length: 20 }, (_, i) => `<i class="${i < f ? "f" : ""}"></i>`).join("")}</div>
    <div class="pct"><span>Tiến độ</span><span>${g.progress}%</span></div>
    <div class="foot"><span class="chip ${cls}">${ic(si, 14)}${txt}</span>
      <button class="btn sm ${g.done ? "g" : ""}" data-done="${g.id}">${ic(g.done ? "undo" : "check", 16)}${g.done ? "Hoàn tác" : "Hoàn thành"}</button></div>
  </div>`;
}

function toggle(id) {
  const g = goals.find(x => x.id === id);
  g.done = !g.done; g.doneAt = g.done ? today() : null;
  if (g.done) g.progress = 100;
  save();
}

/* ---------- thêm / sửa ---------- */
function edit(id) {
  const g = goals.find(x => x.id === id) || { id: "", title: "", level: tab, due: endOf(tab), note: "", progress: 0 };
  let lv = g.level;
  const m = document.getElementById("modal"), s = document.getElementById("sheet");
  s.innerHTML = `<div class="row" style="align-items:center"><h1>${id ? "Sửa mục tiêu" : "Mục tiêu mới"}</h1><button class="ib" id="f-c">${ic("x", 18)}</button></div>
  <label>Loại mục tiêu</label><div class="seg">${Object.entries(LV).map(([k, v]) => `<button type="button" data-lv="${k}" class="${k === lv ? "on" : ""}">${ic(LI[k], 18)}${v}</button>`).join("")}</div>
  <label>Tên mục tiêu</label><input id="f-t" value="${esc(g.title)}" placeholder="VD: Đọc 12 cuốn sách">
  <label>Hạn hoàn thành</label><input type="date" id="f-d" value="${g.due}">
  <label>Tiến độ: <b id="f-pv">${g.progress}</b>%</label><input type="range" id="f-p" min="0" max="100" step="5" value="${g.progress}">
  <label>Ghi chú</label><textarea id="f-n" placeholder="Ghi chú, kế hoạch, tiến độ...">${esc(g.note)}</textarea>
  <div class="btns" style="margin-top:16px">${id ? `<button class="btn r" id="f-x" style="flex:none;padding:12px 16px">${ic("trash", 18)}</button>` : ""}<button class="btn" id="f-s">${ic("check", 18)}Lưu</button></div>`;
  m.classList.add("on");
  const $ = i => document.getElementById(i);
  $("f-p").oninput = e => $("f-pv").textContent = e.target.value;
  s.querySelectorAll("[data-lv]").forEach(b => b.onclick = () => {
    lv = b.dataset.lv; s.querySelectorAll("[data-lv]").forEach(x => x.classList.toggle("on", x === b));
    if (!id) $("f-d").value = endOf(lv);
  });
  $("f-c").onclick = () => m.classList.remove("on");
  m.onclick = e => { if (e.target === m) m.classList.remove("on"); };
  if (id) $("f-x").onclick = () => { if (confirm("Xóa mục tiêu này?")) { goals = goals.filter(x => x.id !== id); m.classList.remove("on"); save(); } };
  $("f-s").onclick = () => {
    const t = $("f-t").value.trim(); if (!t) return $("f-t").focus();
    const o = { ...g, title: t, level: lv, due: $("f-d").value || endOf(lv), progress: +$("f-p").value, note: $("f-n").value };
    if (o.progress === 100 && !o.done) { o.done = true; o.doneAt = today(); }
    else if (o.progress < 100 && o.done) { o.done = false; o.doneAt = null; }
    if (id) goals = goals.map(x => x.id === id ? o : x);
    else { o.id = Date.now().toString(36); o.created = today(); o.done = o.done || false; goals.push(o); tab = o.level; flt = "all"; }
    m.classList.remove("on"); save();
  };
}

/* ---------- đăng nhập ---------- */
function authView() {
  document.getElementById("app").innerHTML = `<div class="auth"><h1 style="font-size:30px">${ic("target",34)} Mục tiêu</h1><p class="sub">Đăng nhập để đồng bộ giữa iPhone và máy tính</p>
  <input id="em" type="email" placeholder="Email" autocomplete="email"><input id="pw" type="password" placeholder="Mật khẩu (≥ 6 ký tự)" autocomplete="current-password">
  <div class="err" id="er"></div>
  <div class="btns"><button class="btn" id="li">Đăng nhập</button><button class="btn g" id="su">Đăng ký</button></div></div>`;
  const go = fn => async () => {
    try { await fn(fb.auth, document.getElementById("em").value, document.getElementById("pw").value); }
    catch (e) { document.getElementById("er").textContent = "Lỗi: " + e.code.replace("auth/", ""); }
  };
  document.getElementById("li").onclick = go(fb.signInWithEmailAndPassword);
  document.getElementById("su").onclick = go(fb.createUserWithEmailAndPassword);
}
</script>
</body>
</html>

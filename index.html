<style>
:root{--bg:#000000;--card:#0a0a0a;--card2:#141414;--line:#2a2a2a;--b:#ffffff;--b2:#d4d4d4;--tx:#ffffff;--mut:#8a8a8a;--ok:#ffffff;--bad:#ffffff;--warn:#a3a3a3}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;min-height:100%}
body{padding:env(safe-area-inset-top) 0 0}
#app{max-width:760px;margin:0 auto;padding:16px 14px calc(96px + env(safe-area-inset-bottom))}
h1{font-size:22px;margin:0}.sub{color:var(--mut);font-size:13px}
.top{display:flex;justify-content:space-between;align-items:center;margin:6px 0 16px}
.ico{background:var(--card2);border:1px solid var(--line);color:var(--tx);border-radius:12px;padding:8px 12px;font-size:13px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center}
.stat b{display:block;font-size:24px}.stat span{font-size:12px;color:var(--mut)}
.tabs{display:flex;background:var(--card);border-radius:14px;padding:4px;margin-bottom:14px;border:1px solid var(--line)}
.tabs button{flex:1;border:0;background:none;color:var(--mut);padding:10px;border-radius:10px;font-weight:600;font-size:15px}
.tabs button.on{background:var(--b);color:#fff}
.goal{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;margin-bottom:12px}
.goal.done{opacity:.8}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.t{font-weight:700;font-size:17px}.done .t{text-decoration:line-through;color:var(--mut)}
.chip{font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;white-space:nowrap}
.c-ok{background:#ffffff22;color:var(--ok)}.c-bad{background:#ffffff22;color:var(--bad)}.c-b{background:#ffffff22;color:var(--b2)}.c-w{background:#a3a3a322;color:var(--warn)}
.note{color:var(--mut);font-size:14px;margin:6px 0 0;white-space:pre-wrap}
.sq{display:grid;grid-template-columns:repeat(20,1fr);gap:4px;margin:12px 0 4px}
.sq i{aspect-ratio:1;border-radius:4px;background:#1a1a1a}.sq i.f{background:var(--b);box-shadow:0 0 8px #ffffff55}
.done .sq i.f{background:var(--ok);box-shadow:none}
.pct{font-size:12px;color:var(--mut);display:flex;justify-content:space-between}
.btns{display:flex;gap:8px;margin-top:10px}
.btn{border:0;border-radius:14px;padding:12px;font-weight:700;font-size:15px;color:#fff;background:var(--b);flex:1}
.btn.g{background:var(--card2);color:var(--b2);border:1px solid var(--line)}.btn.r{background:#ffffff22;color:var(--bad)}
.fab{position:fixed;right:max(18px,calc(50% - 360px));bottom:calc(22px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:50%;border:0;background:var(--b);color:#fff;font-size:34px;box-shadow:0 8px 24px #ffffff66}
.empty{text-align:center;color:var(--mut);padding:40px 0}
.modal{position:fixed;inset:0;background:#000b;display:none;align-items:flex-end;justify-content:center;z-index:9}
.modal.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
@media(min-width:700px){.modal{align-items:center}.sheet{border-radius:24px}}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px}
input,select,textarea{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--tx);border-radius:12px;padding:12px;font:inherit;font-size:16px}
input[type=range]{padding:0;accent-color:var(--b)}
textarea{min-height:90px;resize:vertical}
.auth{max-width:380px;margin:12vh auto 0;text-align:center}
.auth input{margin-bottom:10px}.err{color:var(--bad);font-size:13px;min-height:18px}
/* ===== Giao diện nâng cao ===== */
:root{color-scheme:dark;--glow:#ffffff40;--r:20px}
body{background:radial-gradient(900px 500px at 85% -10%,#ffffff14,transparent 60%),radial-gradient(700px 400px at -10% 30%,#ffffff0d,transparent 60%),var(--bg);background-attachment:fixed}
#app{max-width:900px}
h1{background:linear-gradient(90deg,#fff,var(--b2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:-.4px}
.top{padding:4px 2px}
.ico{transition:.2s}.ico:hover{border-color:var(--b);color:var(--b2)}
.stat{position:relative;overflow:hidden;background:linear-gradient(160deg,#121212,#050505);transition:transform .2s}
.stat::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--b)}
.stat:nth-child(1)::before{background:var(--ok)}.stat:nth-child(3)::before{background:var(--bad)}
.stat:hover{transform:translateY(-2px)}
.stat b{font-size:28px;letter-spacing:-1px}
.tabs{position:sticky;top:calc(env(safe-area-inset-top) + 6px);z-index:5;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);background:#0a0a0acc;box-shadow:0 6px 24px #0008}
.tabs button{transition:.25s;cursor:pointer}
.tabs button.on{background:linear-gradient(135deg,var(--b),#cfcfcf);box-shadow:0 4px 14px var(--glow)}
.tabs button:not(.on):hover{color:var(--tx)}
#app>.goal,#app>div.goal{animation:up .4s both}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media(min-width:900px){#app{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
 .top,.stats,.tabs,.empty{grid-column:1/-1}.goal{margin:0}}
.goal{position:relative;border-radius:var(--r);background:linear-gradient(160deg,#121212,#050505);box-shadow:0 8px 24px #0006;transition:transform .2s,border-color .2s;overflow:hidden}
.goal::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--b)}
.goal:has(.c-bad)::before{background:var(--bad)}.goal:has(.c-ok)::before{background:var(--ok)}.goal:has(.c-w)::before{background:var(--warn)}
.goal:hover{transform:translateY(-2px);border-color:#ffffff66}
.t{letter-spacing:-.2px}
.chip{border:1px solid currentColor;border-color:#ffffff14}
.sq i{transition:background .3s}
.sq i.f{background:linear-gradient(135deg,var(--b2),var(--b))}
.done .sq i.f{background:linear-gradient(135deg,#ffffff,var(--ok))}
.btn{cursor:pointer;transition:transform .12s,filter .2s;background:linear-gradient(135deg,var(--b),#cfcfcf);box-shadow:0 4px 14px var(--glow)}
.btn:hover{filter:brightness(1.12)}.btn:active{transform:scale(.96)}
.btn.g,.btn.r{box-shadow:none;background:var(--card2)}.btn.r{background:#ffffff1f}
.btn.g:hover{border-color:var(--b)}
.fab{cursor:pointer;background:linear-gradient(135deg,var(--b2),var(--b));transition:transform .2s;z-index:6}
.fab:hover{transform:rotate(90deg) scale(1.08)}.fab:active{transform:scale(.92)}
.modal{backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:fade .2s}
.sheet{border:1px solid var(--line);background:linear-gradient(180deg,#121212,#050505);animation:slide .3s cubic-bezier(.2,.8,.2,1)}
@keyframes fade{from{opacity:0}}@keyframes slide{from{transform:translateY(40px);opacity:0}}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--b);box-shadow:0 0 0 3px var(--glow)}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:48px 16px}
.auth{background:linear-gradient(160deg,#121212,#050505);border:1px solid var(--line);border-radius:28px;padding:32px 22px;box-shadow:0 20px 60px #000a}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
button,select{font-family:inherit}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ===== Thuần trắng đen ===== */
.btn{color:#000}.btn.g,.btn.r{color:#fff}
.tabs button.on{color:#000;background:#fff;box-shadow:none}
.fab{color:#000;background:#fff;box-shadow:0 8px 24px #ffffff33}
.btn{background:#fff;box-shadow:none}.btn.g,.btn.r{background:var(--card2);border:1px solid var(--line)}
.chip{border:1px solid #ffffff22}
.c-bad{background:#fff;color:#000;border-color:#fff}
.c-ok{background:transparent;color:#fff;border-color:#fff}
.c-w{background:#ffffff1f;color:#e5e5e5;border:1px dashed #888}
.c-b{background:#ffffff12;color:#bdbdbd}
.goal::before{background:#888}.goal:has(.c-bad)::before{background:#fff}.goal:has(.c-ok)::before{background:#444}.goal:has(.c-w)::before{background:#bbb}
.sq i.f{background:#fff;box-shadow:none}.done .sq i.f{background:#666}
.stat:nth-child(1)::before{background:#666}.stat:nth-child(2)::before{background:#bbb}.stat:nth-child(3)::before{background:#fff}
.goal:hover{border-color:#ffffff55}
body{color-scheme:dark}
/* ===== Giao diện v2: icon line + bottom nav ===== */
#app{padding-bottom:calc(150px + env(safe-area-inset-bottom))}
.top h1{font-size:30px;line-height:1.1}
.top .sub,.sub{display:flex;align-items:center;gap:5px}
.ib{background:var(--card2);border:1px solid var(--line);color:#fff;border-radius:12px;width:38px;height:38px;display:grid;place-items:center;cursor:pointer;flex:none;transition:.2s}
.ib:hover{border-color:#fff}
.hero{display:flex;gap:18px;align-items:center;background:linear-gradient(160deg,#181818,#0a0a0a);border:1px solid var(--line);border-radius:26px;padding:18px;margin-bottom:14px;grid-column:1/-1;box-shadow:0 10px 30px #0008}
.ring{width:98px;height:98px;flex:none}.ring circle+circle{transition:stroke-dashoffset .6s}
.hero h2{margin:0 0 2px;font-size:21px}
.mini{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:13px;color:var(--mut)}
.mini span{display:flex;align-items:center;gap:5px}.mini b{color:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;margin-bottom:14px;grid-column:1/-1;scrollbar-width:none;padding:2px}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;display:flex;gap:7px;align-items:center;border:1px solid var(--line);background:var(--card);color:var(--mut);padding:8px 14px;border-radius:99px;font-size:14px;font-weight:600;cursor:pointer}
.chips button.on{background:#fff;color:#000;border-color:#fff}.chips em{font-style:normal;font-size:12px;opacity:.65}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));width:min(420px,calc(100% - 28px));display:flex;gap:4px;background:#0a0a0acc;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:26px;padding:6px;z-index:7;box-shadow:0 10px 40px #000}
.nav button{flex:1;border:0;background:none;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer;transition:.2s}
.nav button.on{background:#fff;color:#000}
.fab{display:grid;place-items:center;font-size:0;bottom:calc(88px + env(safe-area-inset-bottom));right:max(16px,calc(50% - 440px));width:58px;height:58px}
.fab:hover{transform:rotate(90deg) scale(1.08)}
.goal .row{align-items:center;gap:12px}.gm{flex:1;min-width:0}
.gi{width:44px;height:44px;border-radius:14px;background:#1a1a1a;border:1px solid var(--line);display:grid;place-items:center;flex:none}
.t{font-size:16px}.goal .sub{margin-top:2px}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.sm{flex:none;padding:9px 14px;font-size:14px;border-radius:12px}
.seg{display:flex;gap:4px;background:var(--card2);padding:4px;border-radius:14px;border:1px solid var(--line)}
.seg button{flex:1;display:flex;gap:6px;align-items:center;justify-content:center;padding:10px;border:0;border-radius:10px;background:none;color:var(--mut);font-weight:600;font-size:15px;cursor:pointer}
.seg button.on{background:#fff;color:#000}
.empty{grid-column:1/-1}.empty svg{opacity:.45;margin-bottom:8px}
.auth h1{display:flex;align-items:center;justify-content:center;gap:10px}
@media(max-width:380px){.hero{flex-direction:column;text-align:center}.mini{justify-content:center}}
/* ===== Font Inter ===== */
html,body,button,input,select,textarea{font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{letter-spacing:-.005em;-webkit-font-smoothing:antialiased}
.top{align-items:flex-start;margin-bottom:20px}
.top h1{text-transform:uppercase;font-weight:800;font-size:clamp(40px,13vw,64px);line-height:1;letter-spacing:-.035em;background:none;-webkit-text-fill-color:#fff;color:#fff}
.lnk{display:block;background:none;border:0;color:var(--mut);font-weight:600;font-size:12px;letter-spacing:.2em;text-transform:uppercase;padding:14px 0 0;cursor:pointer}
.lnk:hover{color:#fff}
.today{color:var(--mut);margin-top:14px;font-size:15px}.today b{color:#fff;font-weight:700}
.hero h2,.t{font-weight:700;letter-spacing:-.02em}
.stat b,.ring text{font-weight:800}
.chips button,.nav button,.btn{letter-spacing:0}
/* ===== v3: tổng quan + animation ===== */
.cardx{background:linear-gradient(160deg,#181818,#0a0a0a);border:1px solid var(--line);border-radius:26px;padding:16px 10px;margin-bottom:14px;grid-column:1/-1;box-shadow:0 10px 30px #0008}
.rings{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.rg{background:none;border:0;color:#fff;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;padding:8px 4px;border-radius:18px;transition:background .2s,transform .2s}
.rg:hover{background:#ffffff0d}.rg:active{transform:scale(.95)}
.rg .ring{width:100%;max-width:108px;height:auto}.rg b{font-size:15px;font-weight:700}.rg span{font-size:12px;color:var(--mut)}
.kps{display:grid;grid-template-columns:1fr 1fr;gap:10px;grid-column:1/-1}
@media(min-width:700px){.kps{grid-template-columns:repeat(4,1fr)}}
.kp{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:2px}
.kp svg{color:var(--mut);margin-bottom:8px}.kp b{font-size:34px;font-weight:800;letter-spacing:-.04em;line-height:1}
.kp span{font-weight:600;font-size:14px;margin-top:4px}.kp small{color:var(--mut);font-size:12px}
.kp.hot{background:#fff;color:#000}.kp.hot svg,.kp.hot small{color:#000a}
.sec{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;margin:24px 2px 10px;grid-column:1/-1}
.sec em{font-style:normal;background:#ffffff1a;border-radius:99px;padding:1px 9px;font-size:12px;color:#ddd}
.lst{grid-column:1/-1;display:flex;flex-direction:column;gap:10px}
@media(min-width:900px){.lst{display:grid;grid-template-columns:1fr 1fr}}
.rw{display:flex;align-items:center;gap:12px;background:linear-gradient(160deg,#121212,#050505);border:1px solid var(--line);border-radius:18px;padding:12px;cursor:pointer;transition:transform .2s,border-color .2s}
.rw:hover{border-color:#ffffff55;transform:translateY(-2px)}.rw:active{transform:scale(.98)}
.rw .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px}
.rw .chip{margin-top:6px;font-size:11px;padding:3px 9px;width:fit-content}
.ok{display:flex;gap:8px;align-items:center;justify-content:center;color:var(--mut);border:1.5px dashed var(--line);border-radius:18px;padding:22px;grid-column:1/-1}
/* nav: ô trắng trượt mượt */
.nav{width:min(460px,calc(100% - 28px))}
.nav::before{content:"";position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 24px)/4);background:#fff;border-radius:20px;transform:translateX(calc(var(--idx,0)*(100% + 4px)));transition:transform .5s cubic-bezier(.34,1.35,.64,1)}
.nav button{position:relative;z-index:1}.nav button.on{background:none;color:#000}
.nav button svg{transition:transform .3s}.nav button.on svg{transform:translateY(-1px) scale(1.1)}
/* animation */
@keyframes up2{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
@keyframes fill{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.04);box-shadow:0 0 0 3px #fff}100%{transform:scale(1)}}
#app:not(.enter)>.goal:not(.pop),#app:not(.enter)>div.goal:not(.pop){animation:none}
.enter .hero,.enter .cardx,.enter .kp,.enter .chips,.enter .sec,.enter .goal,.enter .rw,.enter .ok,.enter .empty{animation:up2 .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*55ms)}
.enter .sq i.f{animation:fill .45s cubic-bezier(.34,1.5,.64,1) both;animation-delay:calc(300ms + var(--k,0)*28ms)}
#app .goal.pop,#app .rw.pop{animation:pop .7s cubic-bezier(.2,.8,.2,1)}
.ring circle+circle{transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1)}
.sheet{animation:slide .5s cubic-bezier(.34,1.3,.64,1)}
.btn:active,.ib:active,.chips button:active{transform:scale(.93)}
.fab{animation:fabin .6s .3s cubic-bezier(.34,1.6,.64,1) both}@keyframes fabin{from{transform:scale(0) rotate(-90deg)}}
.goal::before,.stat::before{content:none!important;display:none!important}
/* ===== Tiến độ trực quan ===== */
.prog{margin-top:14px}
.ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.stg{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:5px 11px;border-radius:99px;background:#ffffff14;color:#ddd}
.stg.near{background:#fff;color:#000}.stg.zero{color:var(--mut);background:#ffffff0a}
.pv{font-size:13px;color:var(--mut)}.pv b{font-size:28px;font-weight:800;color:#fff;letter-spacing:-.04em}
.pbar{position:relative;height:32px;margin:0 11px;cursor:pointer;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.trk{position:absolute;left:-11px;right:-11px;top:12px;height:8px;border-radius:99px;background:#1c1c1c;overflow:hidden}
.fill{display:block;height:100%;background:linear-gradient(90deg,#7a7a7a,#fff);border-radius:99px;transition:width .35s cubic-bezier(.2,.8,.2,1)}
.done .fill{background:#6b6b6b}
.tk{position:absolute;top:12px;height:8px;width:2px;background:#000;opacity:.8;transform:translateX(-1px)}
.mk{position:absolute;top:6px;height:20px;width:3px;border-radius:3px;background:#000;box-shadow:0 0 0 1.5px #fff;transform:translateX(-1.5px)}
.knob{position:absolute;top:6px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 2px 10px #000a,0 0 0 5px #ffffff22;transform:translateX(-50%);transition:left .35s cubic-bezier(.2,.8,.2,1),transform .2s}
.drag .fill,.drag .knob{transition:none}.drag .knob{transform:translateX(-50%) scale(1.25)}
.pf{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:6px;font-size:12px;color:var(--mut)}
.stp{display:flex;gap:6px;flex:none}
.stp button{border:1px solid var(--line);background:var(--card2);color:#fff;border-radius:10px;padding:7px 12px;font-size:13px;font-weight:700;cursor:pointer;transition:.15s}
.stp button:hover{border-color:#fff}.stp button:active{transform:scale(.9)}
@keyframes grow{from{width:0}}@keyframes kn{from{left:0}}
.enter .fill{animation:grow 1s .3s cubic-bezier(.2,.8,.2,1) both}
.enter .knob{animation:kn 1s .3s cubic-bezier(.2,.8,.2,1) both}
</style>

/* ---------- ngày tháng ---------- */
const iso = d => { const z = new Date(d); z.setMinutes(z.getMinutes() - z.getTimezoneOffset()); return z.toISOString().slice(0, 10); };
const today = () => iso(new Date());
const diff = (a, b) => Math.round((new Date(a) - new Date(b)) / 864e5); // a - b (ngày)
const fmt = s => s.split("-").reverse().slice(0, 2).join("/");
function endOf(level) {
  const d = new Date();
  if (level === "week") d.setDate(d.getDate() + ((7 - d.getDay()) % 7));
  else if (level === "month") { d.setMonth(d.getMonth() + 1, 0); }
  else { d.setMonth(11, 31); }
  return iso(d);
}

/* ---------- trạng thái từng mục tiêu ---------- */
function status(g) {
  const t = today();
  if (g.done) {
    const d = diff(g.due, g.doneAt);
    if (d > 0) return ["Xong sớm " + d + " ngày", "c-ok"];
    if (d < 0) return ["Xong trễ " + -d + " ngày", "c-w"];
    return ["Xong đúng hạn", "c-ok"];
  }
  const d = diff(g.due, t);
  if (d < 0) return ["Trễ " + -d + " ngày", "c-bad"];
  if (d === 0) return ["Hạn hôm nay", "c-w"];
  return ["Còn " + d + " ngày", "c-b"];
}

/* ---------- Tiến độ trực quan ---------- */
function pace(g) {
  if (!g.created) return null;
  const tot = diff(g.due, g.created); if (tot <= 0) return null;
  return Math.max(0, Math.min(100, Math.round(diff(today(), g.created) / tot * 100)));
}
function stageOf(p) { return p >= 100 ? ["Hoàn thành", ""] : p > 75 ? ["Sắp hoàn thành", "near"] : p > 50 ? ["Đã qua nửa chặng", ""] : p > 25 ? ["Đang tiến hành", ""] : p > 0 ? ["Khởi động", ""] : ["Chưa bắt đầu", "zero"]; }
function progH(g) {
  const p = g.progress, [st, k] = stageOf(p), ex = g.done ? null : pace(g);
  let pc = g.done ? "Đã hoàn thành 100%" : p > 75 ? `Chỉ còn ${100 - p}% nữa là xong` : "";
  if (ex !== null) { const d = p - ex; pc += (pc ? " · " : "") + `Nên đạt ~${ex}% · ` + (d >= 10 ? `Vượt ${d}%` : d <= -10 ? `Chậm ${-d}%` : "Đúng kế hoạch"); }
  if (!pc) pc = "Kéo thanh hoặc bấm +10 để cập nhật";
  return `<div class="prog"><div class="ph"><span class="stg ${k}">${st}</span><span class="pv"><b>${p}</b>%</span></div>
  <div class="pbar" data-bar="${g.id}"><div class="trk"><i class="fill" style="width:${p}%"></i></div>${[25, 50, 75].map(m => `<em class="tk" style="left:${m}%"></em>`).join("")}${ex !== null ? `<em class="mk" style="left:${ex}%" title="Mức nên đạt hôm nay"></em>` : ""}<em class="knob" style="left:${p}%"></em></div>
  <div class="pf"><span>${pc}</span><div class="stp"><button data-step="${g.id}" data-d="-10">−10</button><button data-step="${g.id}" data-d="10">+10</button></div></div></div>`;
}
function setProg(id, p) {
  const g = goals.find(x => x.id === id); if (!g) return;
  p = Math.max(0, Math.min(100, Math.round(p / 5) * 5)); if (p === g.progress) return;
  g.progress = p;
  if (p === 100 && !g.done) { g.done = true; g.doneAt = today(); pop = id; setTimeout(() => pop = null, 1000); }
  else if (p < 100 && g.done) { g.done = false; g.doneAt = null; }
  save();
}
function bindProg() {
  document.querySelectorAll("[data-step]").forEach(b => b.onclick = e => { e.stopPropagation(); const g = goals.find(x => x.id === b.dataset.step); if (g) setProg(g.id, g.progress + +b.dataset.d); });

    const id = bar.dataset.bar; let cur = null;
    const pos = e => { const r = bar.getBoundingClientRect(); return Math.max(0, Math.min(100, Math.round((e.clientX - r.left) / r.width * 20) * 5)); };
    const show = p => { bar.querySelector(".fill").style.width = p + "%"; bar.querySelector(".knob").style.left = p + "%"; bar.closest(".prog").querySelector(".pv b").textContent = p; };
    bar.onpointerdown = e => { bar.setPointerCapture(e.pointerId); cur = pos(e); show(cur); bar.classList.add("drag"); };
    bar.onpointermove = e => { if (cur !== null) { cur = pos(e); show(cur); } };
    bar.onpointerup = () => { if (cur === null) return; bar.classList.remove("drag"); const p = cur; cur = null; setProg(id, p); };
    bar.onpointercancel = () => { cur = null; render(); };
  });
}

  });
  $("f-c").onclick = () => m.classList.remove("on");
  m.onclick = e => { if (e.target === m) m.classList.remove("on"); };
  if (id) $("f-x").onclick = () => { if (confirm("Xóa mục tiêu này?")) { goals = goals.filter(x => x.id !== id); m.classList.remove("on"); save(); } };
  $("f-s").onclick = () => {
    const t = $("f-t").value.trim(); if (!t) return $("f-t").focus();
    const o = { ...g, title: t, level: lv, due: $("f-d").value || endOf(lv), progress: +$("f-p").value, note: $("f-n").value };
    if (o.progress === 100 && !o.done) { o.done = true; o.doneAt = today(); }
    else if (o.progress < 100 && o.done) { o.done = false; o.doneAt = null; }
    if (id) goals = goals.map(x => x.id === id ? o : x);
    else { o.id = Date.now().toString(36); o.created = today(); o.done = o.done || false; goals.push(o); tab = o.level; flt = "all"; }
    m.classList.remove("on"); save();
  };
}

/* ---------- đăng nhập ---------- */
function authView() {
  document.getElementById("nav")?.remove();
  document.getElementById("app").innerHTML = `<div class="auth"><h1 style="font-size:30px"><img src="icons/logo.png" width="40" height="40" alt=""> Mục tiêu</h1><p class="sub">Đăng nhập để đồng bộ giữa iPhone và máy tính</p>
  <input id="em" type="email" placeholder="Email" autocomplete="email"><input id="pw" type="password" placeholder="Mật khẩu (≥ 6 ký tự)" autocomplete="current-password">
  <div class="err" id="er"></div>
  <div class="btns"><button class="btn" id="li">Đăng nhập</button><button class="btn g" id="su">Đăng ký</button></div></div>`;
  const go = fn => async () => {
    try { await fn(fb.auth, document.getElementById("em").value, document.getElementById("pw").value); }
    catch (e) { document.getElementById("er").textContent = "Lỗi: " + e.code.replace("auth/", ""); }
  };
  document.getElementById("li").onclick = go(fb.signInWithEmailAndPassword);
  document.getElementById("su").onclick = go(fb.createUserWithEmailAndPassword);
}
</script>
